name: Build School Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Install image tooling
        run: python3 -m pip install --user Pillow

      - name: Add Android platform and sync plugins
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply School Chat launcher icon
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          res = Path('android/app/src/main/res')
          src = Image.open('public/school-chat-icon.png').convert('RGBA')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              img = src.resize((size, size), Image.Resampling.LANCZOS)
              img.save(out / 'ic_launcher.png')
              img.save(out / 'ic_launcher_round.png')
              img.save(out / 'ic_launcher_foreground.png')

          # Android 8+ (API 26+) ignores the flat PNGs above whenever an
          # adaptive-icon selector exists at mipmap-anydpi-v26/ic_launcher.xml
          # -- Capacitor's default template ships one pointing at its own
          # placeholder foreground/background, which is exactly the
          # "launcher icon looks completely different" symptom. Removing the
          # selector makes Android fall back to the flat PNGs above on every
          # API level, so our real icon actually shows.
          anydpi = res / 'mipmap-anydpi-v26'
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              f = anydpi / name
              if f.exists():
                  f.unlink()
          PY

      - name: Verify web assets were copied into the Android project
        run: |
          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "::error::android/app/src/main/assets/public/index.html नहीं मिली — 'npx cap sync' ने web build कॉपी नहीं की।"
            exit 1
          fi
          echo "Web assets ठीक से Android प्रोजेक्ट में कॉपी हो गए।"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy standalone "tools" package from the SDK
          # repository index; the action's default `packages` input
          # ("tools platform-tools") now fails with "Failed to find package
          # 'tools'" before the build even starts. platform-tools is the only
          # thing we need from this step — Gradle/AGP fetches the actual
          # platform + build-tools it needs on demand during assembleDebug.
          packages: 'platform-tools'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: school-chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
