name: Build School Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Install image tooling
        run: python3 -m pip install --user Pillow

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore/create a stable debug signing key
        # GitHub Actions runners start clean every run, so without this,
        # `npx cap add android` below lets Gradle auto-generate a BRAND NEW
        # ~/.android/debug.keystore on every single build -- meaning every
        # APK is signed with a different key. Android refuses to install a
        # new APK over an existing one signed with a different key ("App not
        # installed" / silently fails), so anyone who already has a previous
        # build has to fully uninstall before every update. Caching one
        # fixed keystore across runs (with the exact standard Android debug
        # keystore alias/passwords, so Gradle's default debug signingConfig
        # picks it up with zero build.gradle changes) fixes that.
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: schoolchat-debug-keystore-v1
      - name: Generate the debug key if the cache was empty (first run only)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Add Android platform and sync plugins
        run: |
          npx cap add android
          npx cap sync android

      - name: Grant Android microphone permission for WebRTC voice calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'android.permission.RECORD_AUDIO' not in text:
              text = text.replace('<application', permission + '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application', 1)
          manifest.write_text(text)
          PY

      - name: Apply School Chat launcher icon (legacy + adaptive)
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          res = Path('android/app/src/main/res')
          src = Image.open('public/school-chat-icon.png').convert('RGBA')
          BRAND = (15, 111, 232, 255)  # matches capacitor.config.json splash backgroundColor

          # 1) Legacy flat icons for every density (pre-Android-8 fallback,
          #    and used directly by the OS on some launchers/manufacturers).
          sizes = {
              'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              img = src.resize((size, size), Image.Resampling.LANCZOS)
              img.save(out / 'ic_launcher.png')
              img.save(out / 'ic_launcher_round.png')

          # 2) A CORRECT adaptive icon (Android 8+ / API 26+), instead of just
          #    deleting the selector as an earlier fix did. That previous fix
          #    solved the "wrong icon on the home screen" problem, but left
          #    Android 12+'s mandatory system splash screen (which derives its
          #    icon from the adaptive icon, not the legacy PNG) with nothing
          #    valid to show -- that's what was rendering as a broken/blank
          #    placeholder symbol on launch. Providing a real adaptive icon
          #    fixes both at once.
          #    Foreground needs generous transparent padding (adaptive icons
          #    get cropped to different shapes per device/launcher) --
          #    standard safe zone is roughly the inner 66% of the canvas.
          fg_sizes = {
              'mipmap-mdpi': 108, 'mipmap-hdpi': 162, 'mipmap-xhdpi': 216,
              'mipmap-xxhdpi': 324, 'mipmap-xxxhdpi': 432,
          }
          for folder, canvas in fg_sizes.items():
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              inner = int(canvas * 0.66)
              icon = src.resize((inner, inner), Image.Resampling.LANCZOS)
              fg = Image.new('RGBA', (canvas, canvas), (0, 0, 0, 0))
              pos = ((canvas - inner) // 2, (canvas - inner) // 2)
              fg.paste(icon, pos, icon)
              fg.save(out / 'ic_launcher_foreground.png')

          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'ic_launcher_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="ic_launcher_background">#0f6fe8</color>\n'
              '</resources>\n'
          )

          anydpi = res / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background"/>\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          (anydpi / 'ic_launcher.xml').write_text(adaptive_xml)
          (anydpi / 'ic_launcher_round.xml').write_text(adaptive_xml)
          PY

      - name: Generate native splash screen
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          res = Path('android/app/src/main/res')
          icon = Image.open('public/school-chat-icon.png').convert('RGBA')

          # One drawable at a generous fixed size covers every density
          # reasonably well for a simple splash (Android scales it); this
          # replaces whatever placeholder icon the OS would otherwise try to
          # derive on its own, which is what was showing up as a broken/odd
          # "two shapes" symbol on launch instead of our actual icon.
          size = 1200
          bg = Image.new('RGBA', (size, size), (15, 111, 232, 255))  # matches capacitor.config.json backgroundColor
          icon_size = int(size * 0.42)
          icon_resized = icon.resize((icon_size, icon_size), Image.Resampling.LANCZOS)
          pos = ((size - icon_size) // 2, (size - icon_size) // 2)
          bg.paste(icon_resized, pos, icon_resized)

          out_dir = res / 'drawable'
          out_dir.mkdir(parents=True, exist_ok=True)
          bg.convert('RGB').save(out_dir / 'splash.png')
          # Also cover the night-mode drawable bucket the plugin checks, with
          # the same image (no separate dark splash design for now).
          night_dir = res / 'drawable-night'
          night_dir.mkdir(parents=True, exist_ok=True)
          bg.convert('RGB').save(night_dir / 'splash.png')
          PY

      - name: Verify web assets were copied into the Android project
        run: |
          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "::error::android/app/src/main/assets/public/index.html नहीं मिली — 'npx cap sync' ने web build कॉपी नहीं की।"
            exit 1
          fi
          echo "Web assets ठीक से Android प्रोजेक्ट में कॉपी हो गए।"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy standalone "tools" package from the SDK
          # repository index; the action's default `packages` input
          # ("tools platform-tools") now fails with "Failed to find package
          # 'tools'" before the build even starts. platform-tools is the only
          # thing we need from this step — Gradle/AGP fetches the actual
          # platform + build-tools it needs on demand during assembleDebug.
          packages: 'platform-tools'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: school-chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
