name: Build School Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify project layout
        run: |
          for f in package.json capacitor.config.json index.html src/main.jsx public/school-chat-icon.png \
                   native/AudioRouter/AudioRouterPlugin.java \
                   native/CatboxUploader/CatboxUploaderPlugin.java \
                   native/MediaCache/MediaCachePlugin.java \
                   native/SystemBars/SystemBarsPlugin.java; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file not found: $f"
              exit 1
            fi
          done
          echo "Repository layout OK."

      # IMPORTANT: do not use `cache: npm` here. This repository deliberately
      # has no package-lock.json, so setup-node's npm cache validation would
      # stop the job before npm install even starts.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Keep one stable debug key between Actions runs so the generated APK can
      # be installed over the previous School Chat debug build.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: schoolchat-debug-keystore-v2

      - name: Generate debug key if needed
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Add Android platform and sync Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Pin Android SDK compatibility for Android 10+
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/variables.gradle')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'minSdkVersion': '23',
              'compileSdkVersion': '35',
              'targetSdkVersion': '35',
          }
          for name, value in replacements.items():
              text, count = re.subn(rf'(\b{name}\s*=\s*)\d+', rf'\g<1>{value}', text, count=1)
              if count == 0:
                  text = text.replace('ext {', f'ext {{\n    {name} = {value}', 1)
          p.write_text(text, encoding='utf-8')
          print(text)
          PY

      - name: Configure native Android plugins and true edge-to-edge window
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pkg = Path('android/app/src/main/java/com/aditya/schoolchat')
          pkg.mkdir(parents=True, exist_ok=True)

          for src in (
              'native/AudioRouter/AudioRouterPlugin.java',
              'native/CatboxUploader/CatboxUploaderPlugin.java',
              'native/MediaCache/MediaCachePlugin.java',
              'native/SystemBars/SystemBarsPlugin.java',
          ):
              destination = pkg / Path(src).name
              destination.write_text(Path(src).read_text(encoding='utf-8'), encoding='utf-8')

          # Draw the WebView underneath BOTH system bars. The bars themselves
          # remain visible; they become transparent overlays on the same app
          # surface instead of separate black/white regions.
          main = '''package com.aditya.schoolchat;\n\nimport android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        // Capacitor must initialize its Activity/bridge first. Registering\n        // custom plugins before super.onCreate() can crash on some Android 10\n        // WebView/OS combinations during Activity startup.\n        super.onCreate(savedInstanceState);\n\n        getWindow().setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE | android.view.WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_HIDDEN);\n\n        registerPlugin(AudioRouterPlugin.class);\n        registerPlugin(CatboxUploaderPlugin.class);\n        registerPlugin(MediaCachePlugin.class);\n        registerPlugin(SystemBarsPlugin.class);\n\n        // Apply edge-to-edge only after Capacitor has finished configuring the\n        // window, and never let a cosmetic system-bar failure kill the app.\n        try {\n            SystemBarsPlugin.apply(getWindow(), false);\n        } catch (Exception ignored) {\n            // Android 10 remains usable even if an OEM window implementation\n            // rejects one of the optional edge-to-edge flags.\n        }\n    }\n}\n'''
          (pkg / 'MainActivity.java').write_text(main, encoding='utf-8')

          # Remove any startup-time opaque system-bar colors from the generated
          # Capacitor theme. The JS/native code later changes only icon contrast.
          for theme_file in list(Path('android/app/src/main/res').glob('values*/styles.xml')) + list(Path('android/app/src/main/res').glob('values*/themes.xml')):
              theme_text = theme_file.read_text(encoding='utf-8')
              if 'name=\"AppTheme\"' not in theme_text:
                  continue

              def set_item(text, name, value):
                  pattern = rf'<item\s+name=\"android:{re.escape(name)}\">.*?</item>'
                  replacement = f'<item name=\"android:{name}\">{value}</item>'
                  if re.search(pattern, text, flags=re.S):
                      return re.sub(pattern, replacement, text, count=1, flags=re.S)
                  return text.replace('</style>', f'        {replacement}\n    </style>', 1)

              theme_text = set_item(theme_text, 'windowDrawsSystemBarBackgrounds', 'true')
              theme_text = set_item(theme_text, 'statusBarColor', '@android:color/transparent')
              theme_text = set_item(theme_text, 'navigationBarColor', '@android:color/transparent')
              theme_text = set_item(theme_text, 'navigationBarDividerColor', '@android:color/transparent')
              theme_file.write_text(theme_text, encoding='utf-8')
              print(f'Patched edge-to-edge AppTheme: {theme_file}')
              break

          print('Native plugins and edge-to-edge MainActivity prepared.')
          PY

      - name: Grant Android permissions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = [
              ('INTERNET', ''),
              ('CAMERA', ''),
              ('RECORD_AUDIO', ''),
              ('MODIFY_AUDIO_SETTINGS', ''),
              ('BLUETOOTH_CONNECT', ''),
              ('BLUETOOTH_SCAN', ' android:usesPermissionFlags="neverForLocation"'),
              ('POST_NOTIFICATIONS', ''),
          ]
          for name, extra in permissions:
              pattern = r'android:name="android\.permission\.' + name + r'"'
              if re.search(pattern, text):
                  continue
              line = f'    <uses-permission android:name="android.permission.{name}"{extra} />\n'
              text = text.replace('<application', line + '    <application', 1)
          manifest.write_text(text, encoding='utf-8')
          print('Manifest permissions prepared.')
          PY

      - name: Apply launcher icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          res = Path('android/app/src/main/res')
          src = Image.open('public/school-chat-icon.png').convert('RGBA')
          sizes = {
              'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(out / 'ic_launcher.png')
              icon.save(out / 'ic_launcher_round.png')

          fg_sizes = {
              'mipmap-mdpi': 108, 'mipmap-hdpi': 162, 'mipmap-xhdpi': 216,
              'mipmap-xxhdpi': 324, 'mipmap-xxxhdpi': 432,
          }
          for folder, canvas in fg_sizes.items():
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              inner = int(canvas * 0.66)
              icon = src.resize((inner, inner), Image.Resampling.LANCZOS)
              fg = Image.new('RGBA', (canvas, canvas), (0, 0, 0, 0))
              fg.paste(icon, ((canvas - inner) // 2, (canvas - inner) // 2), icon)
              fg.save(out / 'ic_launcher_foreground.png')

          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'ic_launcher_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="ic_launcher_background">#0f6fe8</color>\n'
              '</resources>\n', encoding='utf-8')
          anydpi = res / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background"/>\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          (anydpi / 'ic_launcher.xml').write_text(adaptive, encoding='utf-8')
          (anydpi / 'ic_launcher_round.xml').write_text(adaptive, encoding='utf-8')
          PY

      - name: Generate native splash image
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          res = Path('android/app/src/main/res')
          icon = Image.open('public/school-chat-icon.png').convert('RGBA')
          size = 1200
          bg = Image.new('RGBA', (size, size), (15, 111, 232, 255))
          icon_size = int(size * 0.42)
          small = icon.resize((icon_size, icon_size), Image.Resampling.LANCZOS)
          bg.paste(small, ((size - icon_size) // 2, (size - icon_size) // 2), small)
          for folder in ('drawable', 'drawable-night'):
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              bg.convert('RGB').save(out / 'splash.png')
          PY

      - name: Verify Android web assets
        run: |
          test -f android/app/src/main/assets/public/index.html || \
            { echo "::error::Capacitor web assets were not copied into Android."; exit 1; }
          echo "Android web assets OK."

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
