name: Build School Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify project layout
        run: |
          for f in package.json capacitor.config.json index.html src/main.jsx \
                   public/school-chat-icon.png \
                   native/AudioRouter/AudioRouterPlugin.java \
                   native/CatboxUploader/CatboxUploaderPlugin.java \
                   native/MediaCache/MediaCachePlugin.java \
                   native/SystemBars/SystemBarsPlugin.java; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file not found: $f"
              exit 1
            fi
          done
          echo "Project layout OK."

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install Pillow

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: schoolchat-debug-keystore-v1

      - name: Generate the debug key if the cache was empty
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Add Android platform and sync Capacitor
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Add native plugins and configure Android window
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pkg = Path('android/app/src/main/java/com/aditya/schoolchat')
          pkg.mkdir(parents=True, exist_ok=True)
          for src in ('native/AudioRouter/AudioRouterPlugin.java',
                      'native/CatboxUploader/CatboxUploaderPlugin.java',
                      'native/MediaCache/MediaCachePlugin.java',
                      'native/SystemBars/SystemBarsPlugin.java'):
              (pkg / Path(src).name).write_text(Path(src).read_text(encoding='utf-8'), encoding='utf-8')

          (pkg / 'MainActivity.java').write_text(
              'package com.aditya.schoolchat;\n\n'
              'import android.os.Bundle;\n'
              'import android.view.WindowManager;\n'
              'import com.getcapacitor.BridgeActivity;\n\n'
              'public class MainActivity extends BridgeActivity {\n'
              '    @Override\n'
              '    public void onCreate(Bundle savedInstanceState) {\n'
              '        registerPlugin(AudioRouterPlugin.class);\n'
              '        registerPlugin(CatboxUploaderPlugin.class);\n'
              '        registerPlugin(MediaCachePlugin.class);\n'
              '        registerPlugin(SystemBarsPlugin.class);\n'
              '        super.onCreate(savedInstanceState);\n'
              '        getWindow().setSoftInputMode(\n'
              '            WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE\n'
              '            | WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_HIDDEN);\n'
              '        try { SystemBarsPlugin.apply(getWindow(), false); } catch (Exception ignored) {}\n'
              '    }\n'
              '}\n', encoding='utf-8')

          def patch_named_style(text, style_name, items):
              for m in re.finditer(r'<style\\s+name="' + re.escape(style_name) + r'"[^>]*>.*?</style>', text, flags=re.S):
                  block = m.group(0)
                  new_block = block
                  for name, value in items.items():
                      pattern = rf'<item\\s+name="android:{re.escape(name)}">.*?</item>'
                      replacement = f'<item name="android:{name}">{value}</item>'
                      if re.search(pattern, new_block, flags=re.S):
                          new_block = re.sub(pattern, replacement, new_block, count=1, flags=re.S)
                      else:
                          new_block = new_block.replace('</style>', f'        {replacement}\n</style>', 1)
                  return text[:m.start()] + new_block + text[m.end():]
              return text

          for theme_file in list(Path('android/app/src/main/res').glob('values*/styles.xml')) + list(Path('android/app/src/main/res').glob('values*/themes.xml')):
              text = theme_file.read_text(encoding='utf-8')
              if 'name="AppTheme"' in text:
                  new_text = patch_named_style(text, 'AppTheme', {
                      'windowDrawsSystemBarBackgrounds': 'true',
                      'statusBarColor': '@android:color/transparent',
                      'navigationBarColor': '@android:color/transparent',
                  })
                  theme_file.write_text(new_text, encoding='utf-8')
                  break
          PY

      - name: Grant Android permissions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = [
              ('INTERNET', ''), ('CAMERA', ''), ('RECORD_AUDIO', ''),
              ('MODIFY_AUDIO_SETTINGS', ''), ('BLUETOOTH_CONNECT', ''),
              ('BLUETOOTH_SCAN', ' android:usesPermissionFlags="neverForLocation"'),
              ('POST_NOTIFICATIONS', ''),
          ]
          for name, extra in permissions:
              if re.search(r'android:name="android\.permission\.' + name + r'"', text):
                  continue
              if '<application' not in text:
                  raise SystemExit('AndroidManifest.xml has no <application> tag')
              line = f'    <uses-permission android:name="android.permission.{name}"{extra} />\n'
              text = text.replace('<application', line + '    <application', 1)
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Apply launcher icon and splash assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          res = Path('android/app/src/main/res')
          src = Image.open('public/school-chat-icon.png').convert('RGBA')
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              out=res/folder; out.mkdir(parents=True,exist_ok=True)
              img=src.resize((size,size),Image.Resampling.LANCZOS)
              img.save(out/'ic_launcher.png'); img.save(out/'ic_launcher_round.png')
          fg_sizes={'mipmap-mdpi':108,'mipmap-hdpi':162,'mipmap-xhdpi':216,'mipmap-xxhdpi':324,'mipmap-xxxhdpi':432}
          for folder,canvas in fg_sizes.items():
              out=res/folder; out.mkdir(parents=True,exist_ok=True)
              inner=int(canvas*0.66); icon=src.resize((inner,inner),Image.Resampling.LANCZOS)
              fg=Image.new('RGBA',(canvas,canvas),(0,0,0,0)); fg.paste(icon,((canvas-inner)//2,(canvas-inner)//2),icon)
              fg.save(out/'ic_launcher_foreground.png')
          values=res/'values'; values.mkdir(parents=True,exist_ok=True)
          (values/'ic_launcher_background.xml').write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#0f6fe8</color></resources>\n',encoding='utf-8')
          anydpi=res/'mipmap-anydpi-v26'; anydpi.mkdir(parents=True,exist_ok=True)
          adaptive='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>\n'
          (anydpi/'ic_launcher.xml').write_text(adaptive,encoding='utf-8'); (anydpi/'ic_launcher_round.xml').write_text(adaptive,encoding='utf-8')
          outdir=res/'drawable'; outdir.mkdir(parents=True,exist_ok=True)
          bg=Image.new('RGBA',(1200,1200),(15,111,232,255)); sz=504; icon=src.resize((sz,sz),Image.Resampling.LANCZOS); bg.paste(icon,((1200-sz)//2,(1200-sz)//2),icon)
          bg.convert('RGB').save(outdir/'splash.png')
          n=res/'drawable-night'; n.mkdir(parents=True,exist_ok=True); bg.convert('RGB').save(n/'splash.png')
          PY

      - name: Point Android 12+ native splash at the School Chat icon
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          def patch(text):
              for m in re.finditer(r'<style\\b[^>]*>.*?</style>', text, flags=re.S):
                  block=m.group(0)
                  if 'Theme.SplashScreen' not in block: continue
                  for name,value in [('windowSplashScreenBackground','#0F6FE8'),('windowSplashScreenAnimatedIcon','@mipmap/ic_launcher_foreground')]:
                      pat=rf'<item\\s+name="{re.escape(name)}">.*?</item>'
                      rep=f'<item name="{name}">{value}</item>'
                      if re.search(pat,block,flags=re.S): block=re.sub(pat,rep,block,count=1,flags=re.S)
                      else: block=block.replace('</style>',f'        {rep}\n</style>',1)
                  return text[:m.start()]+block+text[m.end():]
              return text
          for f in list(Path('android/app/src/main/res').glob('values*/styles.xml'))+list(Path('android/app/src/main/res').glob('values*/themes.xml')):
              txt=f.read_text(encoding='utf-8'); new=patch(txt)
              if new!=txt: f.write_text(new,encoding='utf-8')
          PY

      - name: Verify Android web assets
        run: test -f android/app/src/main/assets/public/index.html

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Preflight native Java source checks
        run: |
          test -f native/CatboxUploader/CatboxUploaderPlugin.java
          grep -q 'import java.io.FileOutputStream;' native/CatboxUploader/CatboxUploaderPlugin.java
          test -f native/AudioRouter/AudioRouterPlugin.java
          test -f native/MediaCache/MediaCachePlugin.java
          test -f native/SystemBars/SystemBarsPlugin.java
          echo "Native source preflight passed."

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
